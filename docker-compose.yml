services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: autoseg-backend
    ports:
      - "8000:8000"
    volumes:
      # Конфиги и данные монтируются, не копируются в образ
      - ./configs:/app/configs:ro
      - ./data:/app/data
      - ./models:/app/models:ro
      - ./exported_models:/app/exported_models:ro
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - RELOAD_FLAG=${API_RELOAD:-}  # Пусто = no reload, "true" = reload
      - PYTHONPATH=/app
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - autoseg-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: autoseg-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - autoseg-net

networks:
  autoseg-net:
    driver: bridge