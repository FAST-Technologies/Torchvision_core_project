# .github/workflows/ci.yml
name: Python Tests & Validation

on:
  push:
    branches: [ main, dev, develop ]
  pull_request:
    branches: [ main, dev, develop ]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
        sparse-checkout: |
          datasets
          segmenters
          testing
          metrics
          tests
          utils
          requirements.txt
          .github
          test_images
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'

    - name: Set PYTHONPATH
      run: |
        echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV
        export PYTHONPATH="${{ github.workspace }}:$PYTHONPATH"
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgl1 \
          libglib2.0-0 \
          libsm6 \
          libxext6 \
          libxrender-dev \
          libgomp1 \
          ffmpeg \
          libavcodec-dev \
          libavformat-dev \
          libswscale-dev
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r requirements.txt
        pip install pytest pytest-cov black flake8 mypy
    
    - name: Lint with flake8
      run: |
        # Критические ошибки (синтаксис, необъявленные имена)
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Предупреждения (игнорируем C901, макс. длина 127)
        flake8 . --count --exit-zero --max-line-length=127 --statistics --ignore=W503,E704,C901,E501,E203,E402
      continue-on-error: true

    - name: Check for security issues with Bandit
      run: |
        pip install bandit
        bandit -r segmenters/ testing/ metrics/ utils/ datasets/ c -ll -f screen -s B614,B615,B113
      continue-on-error: true

    - name: Check dependencies for vulnerabilities
      run: |
        pip install safety
        count=$(safety check --file requirements.txt --json 2>/dev/null | grep -E '^\s*[\{\[]' | jq -r 'length' 2>/dev/null || echo "0")
        echo "Found $count potential vulnerabilities"
        echo "✅ Dependency check completed"
      continue-on-error: true
    
    - name: Check code formatting with black
      run: |
        black --check . || echo "⚠️ Black check failed, but continuing..."
      continue-on-error: true
    
    - name: Type checking with mypy
      run: |
        export PYTHONPATH="${{ github.workspace }}"
        mypy segmenters/ testing/ metrics/ utils/ datasets/ --ignore-missing-imports --explicit-package-bases
      continue-on-error: true

    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=segmenters --cov=testing --cov=metrics --cov=utils --cov=datasets --cov-report=xml
      continue-on-error: true
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true
        # token: ${{ secrets.CODECOV_TOKEN }}  # для приватных репо
        token: ${{ secrets.GITHUB_TOKEN }}
      if: ${{ matrix.python-version == '3.12' }}
    
    - name: Run basic import tests
      run: |
        python -c "from segmenters.TorchSegmenter import TorchSegmenter; print('✅ TorchSegmenter imports OK')"
        python -c "from segmenters.SklearnSegmenter import SklearnSegmenter; print('✅ SklearnSegmenter imports OK')"
        python -c "from segmenters.OpenCVSegmenter import OpenCVSegmenter; print('✅ OpenCVSegmenter imports OK')"
        python -c "from testing.SegmentationTester import SegmentationTester; print('✅ SegmentationTester imports OK')"
        python -c "from metrics.SegmentationMetrics import SegmentationMetrics; print('✅ SegmentationMetrics imports OK')"
  
  gpu-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Set PYTHONPATH
      run: |
        echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV
        export PYTHONPATH="${{ github.workspace }}:$PYTHONPATH"
    
    - name: Install PyTorch with CUDA support
      run: |
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu118
    
    - name: Install project dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest
    
    - name: Run GPU-compatible tests
      run: |
        pytest tests/ -v -m "gpu" --tb=short
      continue-on-error: true
  
  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run quick benchmark test
      run: |
        python -c "
        from segmenters.TorchSegmenter import TorchSegmenter
        import numpy as np
        import time
        
        # Quick performance test
        segmenter = TorchSegmenter('global_thresholding', threshold=0.5)
        test_img = np.random.randint(0, 255, (256, 256, 3), dtype=np.uint8)
        
        start = time.time()
        for _ in range(10):
            segmenter.segment(test_img)
        elapsed = time.time() - start
        
        print(f'✅ Benchmark: 10 iterations in {elapsed:.2f}s')
        print(f'✅ Average: {elapsed/10:.4f}s per iteration')
        
        if elapsed > 5.0:
            print('⚠️  Warning: Performance degradation detected')
            exit(1)
        "