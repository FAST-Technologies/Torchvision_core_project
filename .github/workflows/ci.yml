# .github/workflows/ci.yml
name: Python Tests & Validation

on:
  push:
    branches: [ main, dev, develop ]
  pull_request:
    branches: [ main, dev, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx libglib2.0-0 libsm6 libxext6 libxrender-dev
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov black flake8 mypy
    
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Check for security issues
      uses: bandit/bandit-action@v1
      with:
        targets: segmenters/ testing/
        format: screen
        level: high
      continue-on-error: true

    - name: Check dependencies for vulnerabilities
      run: |
        pip install safety
        safety check -r requirements.txt
      continue-on-error: true
    
    - name: Check code formatting with black
      run: |
        black --check .
      continue-on-error: true
    
    - name: Type checking with mypy
      run: |
        mypy segmenters/ testing/ metrics/ --ignore-missing-imports
      continue-on-error: true
    
    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=segmenters --cov=testing --cov=metrics --cov-report=xml
      continue-on-error: true
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
      if: matrix.python-version == '3.12'
    
    - name: Run basic import tests
      run: |
        python -c "from segmenters.TorchSegmenter import TorchSegmenter; print('✅ TorchSegmenter imports OK')"
        python -c "from segmenters.SklearnSegmenter import SklearnSegmenter; print('✅ SklearnSegmenter imports OK')"
        python -c "from segmenters.OpenCVSegmenter import OpenCVSegmenter; print('✅ OpenCVSegmenter imports OK')"
        python -c "from testing.SegmentationTester import SegmentationTester; print('✅ SegmentationTester imports OK')"
        python -c "from metrics.SegmentationMetrics import SegmentationMetrics; print('✅ SegmentationMetrics imports OK')"
  
  gpu-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    
    - name: Install PyTorch with CUDA support
      run: |
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu118
    
    - name: Install project dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest
    
    - name: Run GPU-compatible tests
      run: |
        pytest tests/ -v -m "gpu" --tb=short
      continue-on-error: true
  
  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run quick benchmark test
      run: |
        python -c "
        from segmenters.TorchSegmenter import TorchSegmenter
        import numpy as np
        import time
        
        # Quick performance test
        segmenter = TorchSegmenter('global_thresholding', threshold=0.5)
        test_img = np.random.randint(0, 255, (256, 256, 3), dtype=np.uint8)
        
        start = time.time()
        for _ in range(10):
            segmenter.segment(test_img)
        elapsed = time.time() - start
        
        print(f'✅ Benchmark: 10 iterations in {elapsed:.2f}s')
        print(f'✅ Average: {elapsed/10:.4f}s per iteration')
        
        if elapsed > 5.0:
            print('⚠️  Warning: Performance degradation detected')
            exit(1)
        "