# .github/workflows/ci.yml
name: Python Tests & Validation

on:
  push:
    branches: [ main, dev, develop ]
  pull_request:
    branches: [ main, dev, develop ]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
        sparse-checkout: |
          dataseters
          segmenters
          testing
          metrics
          tests
          utils
          requirements.txt
          .github
          test_images
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'

    - name: Set PYTHONPATH
      run: |
        echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV
        export PYTHONPATH="${{ github.workspace }}:$PYTHONPATH"
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgl1 \
          libglib2.0-0 \
          libsm6 \
          libxext6 \
          libxrender-dev \
          libgomp1 \
          ffmpeg \
          libavcodec-dev \
          libavformat-dev \
          libswscale-dev
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r requirements.txt
        pip install pytest pytest-cov black flake8 mypy
    
    - name: Lint with flake8
      run: |
        # Критические ошибки (синтаксис, необъявленные имена)
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Предупреждения (игнорируем C901, макс. длина 127)
        flake8 . --count --exit-zero --max-line-length=127 --statistics --ignore=W503,E704,C901,E501,E203,E402
      continue-on-error: true

    - name: Check for security issues with Bandit
      run: |
        pip install bandit
        bandit -r segmenters/ testing/ metrics/ utils/ dataseters/ -ll -f screen -s B614,B615,B113
      continue-on-error: true

    - name: Generate unused code report
      run: |
        pip install vulture
        # Vulture возвращает код 3, если найдено неиспользуемый код — это нормально
        set +e  # Не выходить при ошибке
        vulture segmenters/ testing/ metrics/ utils/ --min-confidence 50 --exclude=tests/ > unused_code_report.txt 2>&1
        vulture_exit_code=$?
        set -e
        
        echo "## 🗑️ Unused Code Report (exit code: $vulture_exit_code)" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat unused_code_report.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        
        # Коды: 0=чисто, 3=найдено неиспользуемый код, другие=ошибки
        if [ $vulture_exit_code -eq 1 ] || [ $vulture_exit_code -gt 3 ]; then
          echo "❌ Vulture failed with exit code $vulture_exit_code"
          exit 1
        fi
        echo "✅ Vulture completed (code $vulture_exit_code)"
      continue-on-error: true

    - name: Check dependencies for vulnerabilities
      run: |
        pip install safety
        count=$(safety check --file requirements.txt --json 2>/dev/null | grep -E '^\s*[\{\[]' | jq -r 'length' 2>/dev/null || echo "0")
        echo "Found $count potential vulnerabilities"
        echo "✅ Dependency check completed"
      continue-on-error: true
    
    - name: Check code formatting with black
      run: |
        black --check . || echo "⚠️ Black check failed, but continuing..."
      continue-on-error: true
    
    - name: Type checking with mypy
      run: |
        export PYTHONPATH="${{ github.workspace }}"
        mypy segmenters/ testing/ metrics/ utils/ dataseters/ --ignore-missing-imports --explicit-package-bases
      continue-on-error: true

    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=segmenters --cov=testing --cov=metrics --cov=utils --cov=dataseters --cov-report=xml
      continue-on-error: true
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true
        # token: ${{ secrets.CODECOV_TOKEN }}  # для приватных репо
        token: ${{ secrets.GITHUB_TOKEN }}
      if: ${{ matrix.python-version == '3.12' }}
    
    - name: Run basic import tests
      run: |
        python -c "from segmenters.TorchSegmenter import TorchSegmenter; print('✅ TorchSegmenter imports OK')"
        python -c "from segmenters.SklearnSegmenter import SklearnSegmenter; print('✅ SklearnSegmenter imports OK')"
        python -c "from segmenters.OpenCVSegmenter import OpenCVSegmenter; print('✅ OpenCVSegmenter imports OK')"
        python -c "from testing.SegmentationTester import SegmentationTester; print('✅ SegmentationTester imports OK')"
        python -c "from metrics.SegmentationMetrics import SegmentationMetrics; print('✅ SegmentationMetrics imports OK')"

  # ──────────────────────────────────────────────────────────────
  # 📚 Документация: pdoc + проверка Google-style docstrings
  # ──────────────────────────────────────────────────────────────
  docs:
    runs-on: ubuntu-24.04
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pdoc pydocstyle
    
    - name: Check Google-style docstrings with pydocstyle
      run: |
        echo "## 🔍 Проверка docstring (Google style)" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        
        # Проверка основных модулей с игнорированием известных исключений
        pydocstyle segmenters/ testing/ metrics/ utils/ dataseters/ \
          --convention=google \
          --add-ignore=D100,D104,D105,D107,D203,D213 \
          --match='(?!__init__).*\.py' \
          2>&1 | tee pydocstyle_report.txt
        
        echo '```' >> $GITHUB_STEP_SUMMARY
        
        # Считаем количество ошибок (не предупреждений)
        errors=$(grep -c "^segmenters\|^testing\|^metrics\|^utils\|^dataseters" pydocstyle_report.txt || echo "0")
        if [ "$errors" -gt 0 ]; then
          echo "⚠️  Найдено $errors предупреждений по стилю docstring" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ Все docstring соответствуют Google style" >> $GITHUB_STEP_SUMMARY
        fi
      continue-on-error: true
    
    - name: Generate API documentation with pdoc
      run: |
        export PYTHONPATH="${{ github.workspace }}"
        
        # Генерация документации для основных модулей
        pdoc --output-dir ./docs \
          segmenters.TorchSegmenter \
          segmenters.SklearnSegmenter \
          segmenters.OpenCVSegmenter \
          testing.SegmentationTester \
          metrics.SegmentationMetrics 
        
        echo "✅ Документация сгенерирована в ./docs/"
        echo "## 📚 Generated Documentation" >> $GITHUB_STEP_SUMMARY
        echo "- 📁 [segmenters](./docs/segmenters/)" >> $GITHUB_STEP_SUMMARY
        echo "- 📁 [testing](./docs/testing/)" >> $GITHUB_STEP_SUMMARY
        echo "- 📁 [metrics](./docs/metrics/)" >> $GITHUB_STEP_SUMMARY
    
    - name: Deploy documentation to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        publish_branch: gh-pages
        force_orphan: true
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  
  # ──────────────────────────────────────────────────────────────
  # 🔍 Проверка качества кода: docstring + type hints + complexity
  # ──────────────────────────────────────────────────────────────
  code-quality:
    runs-on: ubuntu-24.04
    needs: test
    strategy:
      matrix:
        python-version: ["3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install quality tools
      run: |
        pip install --upgrade pip
        pip install pydocstyle pylint radon
    
    - name: Check docstring coverage
      run: |
        echo "## 📝 Docstring Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        
        # Подсчёт процента функций с docstring
        python -c "
        import ast, sys
        from pathlib import Path
        
        def count_docstrings(directory):
            total, documented = 0, 0
            for py_file in Path(directory).rglob('*.py'):
                if 'test' in str(py_file) or '__pycache__' in str(py_file):
                    continue
                try:
                    tree = ast.parse(py_file.read_text())
                    for node in ast.walk(tree):
                        if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                            if node.name.startswith('_') and not node.name.startswith('__'):
                                continue  # Пропускаем приватные
                            total += 1
                            if ast.get_docstring(node):
                                documented += 1
                except:
                    pass
            return total, documented
        
        for module in ['segmenters', 'testing', 'metrics', 'utils']:
            t, d = count_docstrings(module)
            pct = (d/t*100) if t > 0 else 100
            status = '✅' if pct >= 80 else '⚠️' if pct >= 50 else '❌'
            print(f'{status} {module}: {d}/{t} ({pct:.1f}%) with docstrings')
            print(f'## 📝 {module}', file=sys.stderr)
            print(f'- Coverage: **{pct:.1f}%** ({d}/{t})', file=sys.stderr)
        " 2>> $GITHUB_STEP_SUMMARY
        
        echo '```' >> $GITHUB_STEP_SUMMARY
    
    - name: Check code complexity with radon
      run: |
        echo "## 🔀 Cyclomatic Complexity Report" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        
        radon cc segmenters/ testing/ metrics/ -a -nb \
          | grep -E "^[FCM] .* [ABCDEF]" \
          | head -20 >> $GITHUB_STEP_SUMMARY
        
        echo '```' >> $GITHUB_STEP_SUMMARY
        
        # Fail если есть функции с сложностью > 15
        radon cc segmenters/ -nc 15 --exit-code || echo "⚠️  Найдены сложные функции (>15)"
      continue-on-error: true
    
    - name: Pylint quality check
      run: |
        echo "## 🔎 Pylint Quality Report" >> $GITHUB_STEP_SUMMARY
        
        pylint segmenters/ testing/ metrics/ \
          --disable=C0111,C0103,R0903,R0913,C0301,W0511 \
          --max-line-length=127 \
          --output-format=text \
          --reports=n \
          2>&1 | tee pylint_report.txt
        
        # Извлекаем оценку
        score=$(grep "Your code has been rated at" pylint_report.txt | grep -oP '\d+\.\d+' || echo "N/A")
        echo "- Pylint score: **$score/10**" >> $GITHUB_STEP_SUMMARY
        
        if [[ "$score" != "N/A" ]] && (( $(echo "$score < 7.0" | bc -l) )); then
          echo "❌ Pylint score below threshold (7.0)" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
      continue-on-error: true
  
  gpu-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Set PYTHONPATH
      run: |
        echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV
        export PYTHONPATH="${{ github.workspace }}:$PYTHONPATH"
    
    - name: Install PyTorch with CUDA support
      run: |
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu118
    
    - name: Install project dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest
    
    - name: Run GPU-compatible tests
      run: |
        pytest tests/ -v -m "gpu" --tb=short
      continue-on-error: true
  
  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run quick benchmark test
      run: |
        python -c "
        from segmenters.TorchSegmenter import TorchSegmenter
        import numpy as np
        import time
        
        # Quick performance test
        segmenter = TorchSegmenter('global_thresholding', threshold=0.5)
        test_img = np.random.randint(0, 255, (256, 256, 3), dtype=np.uint8)
        
        start = time.time()
        for _ in range(10):
            segmenter.segment(test_img)
        elapsed = time.time() - start
        
        print(f'✅ Benchmark: 10 iterations in {elapsed:.2f}s')
        print(f'✅ Average: {elapsed/10:.4f}s per iteration')
        
        if elapsed > 5.0:
            print('⚠️  Warning: Performance degradation detected')
            exit(1)
        "