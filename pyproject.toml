# pyproject.toml
[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "."
# disallow_untyped_defs = true          # ❗ Требовать аннотации типов
# disallow_incomplete_defs = true       # ❗ Запретить частичные аннотации
# check_untyped_defs = true             # ❗ Проверять функции без аннотаций
# no_implicit_optional = true           # ❗ Явный Optional[T] вместо T = None
# strict_equality = true                # ❗ Предупреждать о сравнении разных типов
# warn_redundant_casts = true           # ❗ Лишние приведения типов

[[tool.mypy.overrides]]
module = "utils.*"
implicit_reexport = true

# ===== PYTEST: ДОПОЛНИТЕЛЬНЫЕ НАСТРОЙКИ =====
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--doctest-modules",
    "--cov=segmenters",
    "--cov=metrics", 
    "--cov=testing",
    "--cov-report=html",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "gpu: marks tests that require CUDA",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "benchmark: marks performance benchmark tests",
    "export: marks model export tests (ONNX/TensorRT)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::pytest.PytestUnknownMarkWarning",
]
# Для async-тестов (если используются)
asyncio_mode = "auto"
# Логирование во время тестов
log_cli = true
log_cli_level = "INFO"
log_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

# ===== COVERAGE: УЛУЧШЕНИЯ =====
[tool.coverage.run]
source = ["segmenters", "metrics", "testing", "datasets", "utils"]
branch = true
parallel = true  # Для параллельного запуска тестов
omit = [
    "*/__pycache__/*",
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
    "*/__init__.py",  # Опционально
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "pass",
]
show_missing = true
precision = 2
skip_covered = true  # Не показывать файлы с 100% покрытием
# fail_under = 80      # ❗ Минимальный порог покрытия для CI

# ===== FORMATTING & LINTING (рекомендуется добавить) =====
[tool.ruff]
line-length = 120
target-version = "py313"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG"]
ignore = ["E501"]  # Длина строки контролируется black

[tool.ruff.isort]
known-first-party = ["segmenters", "metrics", "testing", "utils"]

[tool.black]
line-length = 120
target-version = ["py313"]
include = '\.pyi?$'

# ===== BUILD SYSTEM (если планируется публикация) =====
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "segmentation-framework"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "pillow>=10.0",
]